services:
  - type: web
    name: mahjong-together
    runtime: node
    plan: free
    region: frankfurt
    branch: codex/mahjong-together
    autoDeployTrigger: "off"
    # TypeScript/Vite and declaration packages are dev dependencies, so include them
    # explicitly while NODE_ENV=production is set for the service.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
